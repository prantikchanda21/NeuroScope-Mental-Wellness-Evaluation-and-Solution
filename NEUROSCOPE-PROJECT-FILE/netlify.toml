[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# IMPORTANT: redirect order matters — Netlify uses the first matching rule.
# This /api/* rule MUST come before the catch-all "/*" rule below, or every
# /api/... request just gets served index.html instead of hitting the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
